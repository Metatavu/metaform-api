name: Publish master docker image

on:
  push:
    branches:
    - master

env:
  REGISTRY: ghcr.io
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build-and-push-image:
    environment: master
    permissions:
      contents: read
      packages: write
    runs-on: linux_x64_8_cpu_32_gb
    steps:
    - name: Resolve docker image name
      id: image_name
      run: |
        echo "IMAGE_NAME=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT
    - name: Import Secrets
      id: import-secrets
      uses: hashicorp/vault-action@v2
      with:
        url: ${{ secrets.VAULT_ADDR }}
        token: ${{ secrets.VAULT_TOKEN }}
        secrets: |
          ${{ secrets.VAULT_PATH }} CHARTS_UPDATE_PAT | CHARTS_UPDATE_PAT ;
          ${{ secrets.VAULT_PATH }} GH_CHECKOUT_SUBMODULE_PAT | GH_CHECKOUT_SUBMODULE_PAT ;
    - name: Checkout Main Repository
      uses: actions/checkout@v4
      with:
        submodules: false
    - name: Configure and Checkout Private Submodule
      run: |
        git config --global url."https://${{ env.GH_CHECKOUT_SUBMODULE_PAT }}@github.com/".insteadOf "git@github.com:"
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 21
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build application
      run: |
        ./gradlew -x test -x testNative build -Dquarkus.package.type=native -Dquarkus.native.container-build=true -Dquarkus.native.native-image-xmx=32G --info
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image_name.outputs.IMAGE_NAME }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        file: src/main/docker/Dockerfile.native
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
